---
- name: Connecting to CentOS hosts
  hosts: centos
  become: True
  tasks:
    - name: Write group message
      copy:
        content: "{{ grp_message }}\n"
        dest: "/home/{{ ansible_user }}/grp_message"

    - name: Write host message
      copy:
        content: "{{ host_message }}\n"
        dest: "/home/{{ ansible_user }}/host_message"

    - name: Ensure firewalld is installed
      yum:
        name: firewalld
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure tree is installed
      yum:
        name: tree
        state: present
      when: ansible_os_family == "RedHat"
